# Coordinates are defined here and nowhere else. Before the first release, these two lines are all it takes to move them.
GROUP=io.github.wesley-product
VERSION_NAME=0.1.0-SNAPSHOT

POM_URL=https://github.com/wesley-product/stepgrid-llm-kit
POM_SCM_URL=https://github.com/wesley-product/stepgrid-llm-kit
POM_SCM_CONNECTION=scm:git:git://github.com/wesley-product/stepgrid-llm-kit.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/wesley-product/stepgrid-llm-kit.git
POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_DEVELOPER_ID=wesley-product
POM_DEVELOPER_NAME=wsKim

org.gradle.jvmargs=-Xmx2048m
org.gradle.caching=true
android.useAndroidX=true

# Publishing target and signing. Credentials live in ~/.gradle/gradle.properties, never here:
#   mavenCentralUsername / mavenCentralPassword  (Central Portal user token)
#   signingInMemoryKey / signingInMemoryKeyId / signingInMemoryKeyPassword
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true
